# Named per-venue cost models (ARCH-004 §3, Blueprint §7 Sprint 4).
#
# Every number below is an EXPLICIT, honestly-sourced cost, quoted in PRICE
# UNITS PER UNIT OF SIZE (for XAUUSD: US dollars per troy ounce). Costs marked
# "estimate" are the developer's honest median guess for a retail account, not a
# measured venue quote — the battery will treat them as such. When a real broker
# statement is available these are replaced with measured medians (a new version,
# never an in-place edit that hides the provenance).
#
# The round-trip cost the model charges a closed trade, per unit of size, is:
#
#     cost_per_unit = spread + 2 * (slippage_per_side + commission_per_side)
#
#   * spread            — full bid/ask spread, crossed once over a round trip
#                         (buy the ask on entry, sell the bid on exit for a long).
#   * slippage_per_side — adverse fill vs the decision price, charged on BOTH the
#                         entry and the exit fill (hence the factor of 2).
#   * commission_per_side — broker commission per fill, expressed per unit of
#                         size, charged on both fills (factor of 2).
#
# All three are >= 0. apply() multiplies cost_per_unit by |size| (costs are
# direction-independent) and subtracts it from the gross P&L of each trade.

version: 1

venues:
  xauusd_retail_median:
    instrument: XAUUSD
    unit: troy_ounce          # size is measured in troy ounces
    currency: USD             # all prices/costs are US dollars
    spread: 0.30              # estimate — retail median bid/ask on XAUUSD (USD/oz)
    slippage_per_side: 0.05   # estimate — adverse fill per side (USD/oz)
    commission_per_side: 0.035  # estimate — ~$3.50 per 100-oz lot per side => 0.035 USD/oz
    version: "0.1.0"
    note: >
      All figures are honest estimates for a median retail XAUUSD account
      (spread-inclusive broker with a small commission). Round-trip cost per
      ounce = 0.30 + 2*(0.05 + 0.035) = 0.47 USD/oz.

  xauusd_retail_h07:
    # RATIFIED by the Owner 2026-07-30 (NP-ADR-008 Decision A). NAME IMMUTABILITY
    # APPLIES: frozen the moment any ledger record cites it; every change is a NEW
    # name, never an in-place edit. Reconciles NP-D-004's requirement to unify
    # QRF's 0.47 USD/oz estimate with the bespoke stack's 26-tick figure.
    instrument: XAUUSD
    unit: troy_ounce
    currency: USD
    spread: 0.24              # MEASURED median across the 60 Stage-2 tick files (24 ticks)
    slippage_per_side: 0.05   # adopted from xauusd_retail_median (declared estimate)
    commission_per_side: 0.035 # adopted from xauusd_retail_median (declared estimate)
    version: "1.0.0"
    note: >
      Round-trip = 0.24 + 2*(0.05 + 0.035) = 0.41 USD/oz. The spread is MEASURED
      from the evidence dataset itself (Stage2_DataValidationReport: median 24
      ticks across all 60 daily files); slippage and commission are QRF's declared
      estimates, adopted unchanged. The bespoke stack charged 26 ticks (0.26
      USD/oz) - approximately spread-only, charging almost nothing for slippage or
      commission. Sealed BEFORE the run so that a cost-driven divergence in the
      NP-S1 comparison cannot later be misread as an instrument divergence.
