name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows, deliberately (A-010): this project is Windows-only, forever
    # (the MT5 terminal, and everything S03 onward builds against it, is
    # Windows-only). CI must tell the truth about the platform the code
    # actually runs on, not the cheapest platform that happens to import it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest
