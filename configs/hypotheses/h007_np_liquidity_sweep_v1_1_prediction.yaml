  the reclose window -- entering in the sweep's own direction (SELL on a
  HIGH-pool sweep, BUY on a LOW-pool sweep) at the next bar's open and holding
  12 M5 bars (1h) beats RANDOM entry timing, net of xauusd_retail_h07 costs, on
  the designated TRAINING window. THREE NON-EQUIVALENCE STATEMENTS (NP-ADR-008
