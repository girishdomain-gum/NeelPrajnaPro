# H-007 — neelprajna liquidity sweep, PREDICTION claim (NP-ADR-008 SS5 v1.1).
# PRE-REGISTERED: every threshold fixed BEFORE the Battery run. One of TWO
# sealed registrations for this lineage (Execution Plan SS4 deliverable 3) — the
# companion E2 existence claim is a separate record
# (h007_np_liquidity_sweep_v1_1_e2_existence.yaml). Editing any field below
# re-registers as a NEW hypothesis id.
#
# Judged this sprint by the real EvidenceBattery vs the random-timing placebo
# (entry_time_shuffle). No phenomenon is declared "established" by this
# prediction-gate verdict alone (Scientific Model SS5.4 / NP-ADR-008 SS6) --
# ESTABLISHED status is the E2 existence claim's question, deferred to when N2
# null machinery certifies.
#
# TRADE RULE DIVERGENCE FROM NP-ADR-008 SS3 (see
# docs/coordination/notes/NOTE-NP-001_engine_cannot_express_evidenced_stop_target.md):
# the evidenced prediction layer specifies a PER-TRADE-VARIABLE stop
# (penetration extreme +/-10 ticks) and a 1.5R target at 1-second mid
# resolution. The real Kernel's audited EventEngine supports only a SINGLE
# FIXED stop_offset/target_offset per hypothesis (bar-level intrabar
# resolution) -- it cannot express a per-event variable level. Rather than
# fabricate a fixed numeric stand-in that would misrepresent the evidenced
# rule, this registration tests direction + timing ONLY: no stop, no target,
# pure time-stop exit at hold_bars=12 (the evidenced 12-bar/1h time stop,
# which the engine DOES express exactly), entering next-bar-open in the
# event's own encoded direction. Direct precedent:
# h001_fvg_follow_through.yaml uses the identical stop_offset:null /
# target_offset:null pattern ("naive, no stop/target"). This is a genuine,
# newly-discovered divergence for deliverable 5's comparison report -- beyond
# M1-M7 -- and is sealed here, before the run.

lineage: h007_np_liquidity_sweep_v1_1

scope: xauusd_m5_vantage

window: "01KYSEDSM6K5ZKWK0XRCC4SVZ7"  # TRAINING [2026-04-20T22:00:00Z, 2026-07-10T14:33:00Z) on xauusd_m5_vantage

instruments:
  - neelprajna.liquidity_sweep@1.1.0

setup_dsl:
  event: neelprajna.liquidity_sweep.sweep   # POOL_FORMED events are NOT trade signals -- filtered out by the run script
  direction: follow_through                 # trade the event's own encoded direction (SELL on HIGH sweep / BUY on LOW sweep)
  entry: next_open
  claim_form: prediction

execution:
  hold_bars: 12         # NP-ADR-008 SS3: time stop 12 bars (1h on M5)
  size: 1.0
  strength_min: 0.0
  stop_offset: null      # see divergence note above -- engine cannot express the evidenced variable stop
  target_offset: null    # see divergence note above -- engine cannot express the evidenced 1.5R variable target
  exit_rule: time_stop

cost_model_ref: xauusd_retail_h07

split_spec:
  n_folds: 4
  embargo_bars: 15       # >= hold_bars + 1 (= 13); margin per DEVQ-011 convention

thresholds:
  min_n: 100              # NP-ADR-008 SS4 M6: judged n will be materially smaller than 324 by construction (fold TEST-range re-simulation); precedent floor per h001
  base_alpha: 0.05        # one-sided; deflated at judgment against the family's full 19-trial count (NP-ADR-008: p < 0.00263)
  correction:
    method: bonferroni    # vs the trial ledger for family xauusd/neelprajna at judging time

# Sealed placebo null (the prediction claim's OWN test -- NOT N2; N2 is the
# separate E2 existence claim's null, not yet machinery-supported, see the
# companion registration).
placebo_method: entry_time_shuffle

