# H-004 — Monday day-of-week drift, v2 (ARCH-009 §4.3, Wave 2). PRE-REGISTERED:
# every threshold fixed BEFORE any run. The DEVQ-019 successor to H-003 on three
# counts, all sealed here: (1) a CALENDAR exit, not a bar count — exit at the OPEN
# of the LAST bar sharing the entry's server-Monday (epoch-day), so the hold tracks
# the actual Monday close instead of an approximate 22 bars; (2) a MULTI-WINDOW
# union (schema v3, DEVQ-022 Option A) over the 2024 AND 2025 training spans, judged
# as one evidence set with the 2024 VIRGIN reserve as an untouched hole between them;
# (3) placebo_method sealed IN the YAML (ARCH-009 §2). Editing any field re-registers
# as a NEW hypothesis id.
#
# INTERPRETATION GUARD (ARCH-009 §4.3, OBS-1): the claim under test is "Monday beats
# RANDOM TIMING", NOT "Monday is profitable". The placebo (entry_time_shuffle) is the
# null of random entry timing; the placebo ceiling at the deflated alpha is the
# arbiter of a PASS. A PASS that the placebo also reaches often is NOT evidence.

lineage: h004_dow_monday_drift_v2   # FRESH lineage — both training windows available

scope: xauusd_h1

# Multi-window union (schema v3): the two disjoint TRAINING spans. Order = seam
# order; the 2024 VIRGIN reserve sits between them and is never in the union.
window_refs:
  - 01KYB4SSC96SSS8RA7D1NMTPEX   # 2024-training [2024-01-02 .. 2024-09-12 08:00) on xauusd_h1_full
  - 01KYDE784029NZNXPPN5PA8P8G   # 2025-training [2025-01-02 .. 2025-09-12 14:00) on xauusd_h1_primary_full

instruments:
  - seasonality.calendar@0.1.0   # calibrated day-of-week / session detector

setup_dsl:
  event: seasonality.dow.mon     # first bar of each (server) Monday
  direction: long                # fixed long-at-open (lifted in the judge)
  entry: next_open
  exit: calendar_same_dow        # last bar sharing the entry bar's epoch-day (DEVQ-019 successor)

execution:
  hold_bars: 24                  # MAX-hold bound for an H1 day (embargo + calendar cap); actual exit is calendar
  size: 1.0
  strength_min: 0.0
  stop_offset: null
  target_offset: null
  exit_rule: calendar_day        # the engine's same-epoch-day exit (ARCH-009 §4)

cost_model_ref: xauusd_retail_median

split_spec:
  n_folds: 4                     # per window (union => 8 fold TEST blocks pooled)
  embargo_bars: 25               # >= hold_bars + 1 (= 25); clears the calendar cap

thresholds:
  min_n: 45                      # DEVQ-022 Q2 RATIFIED (72 Mondays -> ~56 surviving; 45 leaves headroom)
  base_alpha: 0.05               # one-sided
  correction:
    method: bonferroni           # family xauusd_h1/seasonality.calendar -> N_trials ~0 -> effective ~= base

# Sealed placebo null (ARCH-009 §2 / DEVQ-018): a fixed-direction TIMING claim.
placebo_method: entry_time_shuffle

# v2 pre-commitments (DEVQ-014/015) — written BEFORE running.
thesis: >-
  Entering long at the open after each server-Monday marker and holding to that
  Monday's close beats RANDOM entry timing, net of retail costs, on XAUUSD across
  the 2024+2025 training span.
family: xauusd_h1/seasonality.calendar
observatory_ancestry: []
outcome_interpretations:
  PASS: >-
    Monday timing carries an edge beyond random entry timing (OBS-1): the effect
    clears the deflated alpha AND the placebo ceiling. Corroboration by an
    independent lens is the next gate, not a promotion.
  FAIL: >-
    Monday timing shows no edge over random timing net of costs — the day-of-week
    drift does not pay once random entry is the benchmark.
  INSUFFICIENT: >-
    too few surviving Mondays across the union to decide — needs more data, never
    looser thresholds.
