  strength_min: 0.0
  stop_offset: null      # see divergence note above -- engine cannot express the evidenced variable stop
  target_offset: null    # see divergence note above -- engine cannot express the evidenced 1.5R variable target
  exit_rule: time_stop

cost_model_ref: xauusd_retail_h07

split_spec:
  n_folds: 4
  embargo_bars: 15       # >= hold_bars + 1 (= 13); margin per DEVQ-011 convention

thresholds:
