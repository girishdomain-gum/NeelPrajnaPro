name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + tests (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment (locked)
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Pytest (all tests, incl. kernel firewall)
        run: uv run pytest
