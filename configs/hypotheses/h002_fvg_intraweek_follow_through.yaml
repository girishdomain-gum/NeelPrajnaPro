# H-002 — intra-week FVG follow-through (PRE-REGISTERED in ARCH-008 §3,
# thresholds fixed BEFORE any run). Setup = H-001 MINUS weekend-born events
# (the observatory's weekend-partition question, 01KYCFNE46BB7H2V300D1WZG1P,
# asked whether weekend-born FVGs behave differently: -1.56 vs -0.13). This
# hypothesis excludes them and asks whether the intra-week subset carries a real
# edge. Editing any field re-registers as a NEW hypothesis id.
#
# The weekend-born exclusion is applied in the judge as the setup filter, using
# the scan's OWN spans_weekend rule (qrf.trading.observatory.scans) — one source
# of truth, so the IVF can recompute the partition against the same code.

lineage: h002_fvg_intraweek_follow_through
scope: xauusd_h1

# The TRAINING window on the full XAUUSD H1 dataset. H-001 burned this window for
# ITS lineage; this is a NEW lineage, so the window is available (burns are per
# (window, lineage)).
window: 01KYB4SSC96SSS8RA7D1NMTPEX

instruments:
  - smc.fvg@0.1.0            # same calibrated FVG detector as H-001

setup_dsl:
  event: smc.fvg
  direction: follow_through  # trade the event's own direction (bull AND bear)
  exclude: weekend_born      # <- the only change from H-001 (applied in the judge)

execution:
  hold_bars: 4               # H-001's execution, exactly
  size: 1.0
  strength_min: 0.0
  stop_offset: null
  target_offset: null

cost_model_ref: xauusd_retail_median

split_spec:
  n_folds: 4
  embargo_bars: 8            # >= hold_bars + 1 (= 5)

thresholds:
  min_n: 100
  base_alpha: 0.05           # one-sided
  correction:
    method: bonferroni       # family xauusd_h1/smc.fvg carries 502 trials -> ~1e-4

# v2 pre-commitments (DEVQ-014/015) — written BEFORE running.
thesis: >-
  Intra-week-only FVG follow-through (weekend-born events excluded) is profitable
  net of costs on XAUUSD H1.
family: xauusd_h1/smc.fvg
observatory_ancestry:
  - 01KYCFNE46BB7H2V300D1WZG1P   # weekend-partition question this claim descends from
outcome_interpretations:
  PASS: >-
    the weekend subset was masking a real intra-week edge — escalate to second-lens.
  FAIL: >-
    FVG follow-through has no edge even intra-week; the family is deprioritized.
  INSUFFICIENT: >-
    the weekend filter cost too many trades; no conclusion.
